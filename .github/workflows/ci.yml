name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # El build de CI no necesita credenciales: sin Supabase, el formulario muestra un aviso
      # en lugar de fingir un envío exitoso.
      - run: npm run build
        env:
          VITE_SITE_URL: https://www.aiduoficial.com
