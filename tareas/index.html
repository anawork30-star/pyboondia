<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis tareas · AIDU</title>
    <meta name="description" content="Sección privada de AIDU." />
    <!-- Área privada: no debe aparecer en buscadores -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f3ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- App instalable "Mis tareas" (acceso directo en el celular) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mis tareas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Guarda el aviso de instalación aunque llegue antes de que cargue la página de tareas.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__aiduInstall = e
        window.dispatchEvent(new Event('aidu-installable'))
      })
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=swap"
    />
  </head>
  <body data-page="tareas">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
